<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>calendar</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fef9f7;--pink:#ffd6e0;--pink-deep:#f9a8c0;--pink-text:#d46a8a;--ink:#7a5a62;--muted:#c4a8ae;--card:#fff;}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:12px;}
.wrap{border-radius:24px;overflow:hidden;background:var(--card);box-shadow:0 4px 20px rgba(0,0,0,.03);}
.head{padding:12px 16px;background:linear-gradient(135deg,#fef9f7,#fff0f4);display:flex;align-items:center;gap:10px;}
.head .t{font-size:13px;font-weight:800;}
.nav{margin-left:auto;display:flex;gap:6px;align-items:center;}
.nav button{border:none;background:#fff;border-radius:999px;width:26px;height:26px;cursor:pointer;color:var(--pink-text);font-weight:800;box-shadow:0 2px 8px rgba(0,0,0,.05);}
.nav span{font-size:12px;font-weight:800;}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:8px;}
.dow{text-align:center;padding:6px 4px;font-size:10px;font-weight:800;color:var(--muted);}
.day{background:#fffdfc;border-radius:10px;min-height:48px;padding:6px;font-size:11px;transition:.15s;}
.day:hover{background:#fff5f8;}
.day .dn{font-weight:800;margin-bottom:4px;font-size:11px;}
.day.today .dn{background:var(--pink-deep);color:#fff;border-radius:50%;width:24px;height:24px;display:flex;align-items:center;justify-content:center;}
.day.other{opacity:.25;}
.ev{background:var(--pink);color:var(--pink-text);border-radius:8px;padding:3px 7px;margin-bottom:3px;font-size:10px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
#setup{text-align:center;padding:50px 24px;}
#setup .e{font-size:40px;margin-bottom:12px;}
#setup p{color:var(--muted);font-size:12px;margin-bottom:20px;}
#setup input{padding:14px 18px;border-radius:999px;border:2px solid var(--bg);background:#fff;font-size:13px;width:100%;max-width:280px;margin-bottom:12px;outline:none;}
#setup input:focus{border-color:var(--pink);}
#setup button{padding:14px 32px;border-radius:999px;border:none;background:var(--ink);color:#fff;font-weight:800;cursor:pointer;}
.hidden{display:none!important;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><span class="t">📅 calendar</span><div class="nav"><button id="pv">‹</button><span id="mt"></span><button id="nx">›</button></div></div>
  <div id="setup"><div class="e">📅</div><p>노션 토큰을 입력하면<br>일정이 달력에 보여요 🤍</p><input type="password" id="tk" placeholder="Notion 토큰"><br><button id="go">연결하기 🩷</button></div>
  <div id="main" class="hidden"><div class="cal" id="cal"></div></div>
</div>
<script>
const API='https://api.notion.com/v1',VER='2022-06-28',DBID='c50c55d8-9436-4edb-5fab-3c76b5e166f';
let TK='';try{TK=localStorage.getItem('nf_token')||'';}catch(e){}
let cur=new Date();cur.setDate(1),evs={};
const $=s=>document.querySelector(s);
const H=()=>({'Authorization':'Bearer '+TK,'Notion-Version':VER,'Content-Type':'application/json'});
async function api(p,m='GET',b){const r=await fetch(API+p,{method:m,headers:H(),body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json();}
const tn=p=>{try{return p.properties['할 일'].title.map(t=>t.plain_text).join('')||'';}catch(e){return '';}};
const dt=p=>{try{return p.properties['날짜'].date?p.properties['날짜'].date.start:'';}catch(e){return '';}};
async function load(){const j=await api('/databases/'+DBID+'/query','POST',{page_size:100});evs={};j.results.forEach(p=>{const d=dt(p);if(d){const k=d.slice(0,10);(evs[k]=evs[k]||[]).push(tn(p));}});render();}
function render(){const y=cur.getFullYear(),m=cur.getMonth();$('#mt').textContent=y+'. '+(m+1);
const f=new Date(y,m,1).getDay(),ds=new Date(y,m+1,0).getDate(),td=new Date().toISOString().slice(0,10);
let h=['일','월','화','수','목','금','토'].map(d=>'<div class="dow">'+d+'</div>').join('');
for(let i=0;i<f;i++)h+='<div class="day other"></div>';
for(let d=1;d<=ds;d++){const k=y+'-'+String(m+1).padStart(2,'0')+'-'+String(d).padStart(2,'0');
h+='<div class="day'+(k===td?' today':'')+'"><div class="dn">'+d+'</div>'+((evs[k]||[]).slice(0,2).map(e=>'<div class="ev">'+e.slice(0,8)+'</div>').join(''))+'</div>';}
$('#cal').innerHTML=h;}
$('#pv').onclick=()=>{cur.setMonth(cur.getMonth()-1);render();};
$('#nx').onclick=()=>{cur.setMonth(cur.getMonth()+1);render();};
async function boot(){if(!TK)return;$('#setup').classList.add('hidden');$('#main').classList.remove('hidden');try{await load();}catch(e){$('#setup').classList.remove('hidden');$('#main').classList.add('hidden');}}
$('#go').onclick=()=>{const v=$('#tk').value.trim();if(!v)return;TK=v;try{localStorage.setItem('nf_token',v);}catch(e){}boot();};
boot();
</script>
</body>
</html>
