<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>tasks</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#fef9f7;--pink:#ffd6e0;--pink-deep:#f9a8c0;--pink-text:#d46a8a;--blue:#d6e8ff;--ink:#7a5a62;--muted:#c4a8ae;--card:#fff;}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--ink);font-size:13px;}
.wrap{border-radius:24px;overflow:hidden;background:var(--card);box-shadow:0 4px 20px rgba(0,0,0,.03);}
.head{padding:12px 16px;background:linear-gradient(135deg,#fef9f7,#fff0f4);display:flex;align-items:center;gap:10px;}
.head .t{font-size:13px;font-weight:800;}
.tabs{margin-left:auto;display:flex;gap:6px;background:#fff;border-radius:999px;padding:3px;box-shadow:0 2px 8px rgba(0,0,0,.04);}
.tabs button{border:none;background:transparent;padding:6px 12px;border-radius:999px;font-size:11px;font-weight:700;color:var(--muted);cursor:pointer;transition:.2s;}
.tabs button.on{background:var(--pink);color:#fff;}
.list{padding:12px;}
.it{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;margin-bottom:8px;background:#fffdfc;box-shadow:0 2px 10px rgba(0,0,0,.03);transition:.15s;cursor:pointer;}
.it:hover{transform:translateX(4px);}
.it.done{opacity:.45;}
.it.done .tt{text-decoration:line-through;}
.cb{width:24px;height:24px;border-radius:50%;border:2.5px solid var(--pink);flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;color:#fff;transition:.2s;cursor:pointer;}
.it.done .cb{background:var(--pink-deep);border-color:var(--pink-deep);}
.tt{flex:1;font-size:13px;font-weight:500;}
.tm{font-size:10px;color:var(--muted);font-weight:600;background:var(--bg);padding:4px 10px;border-radius:999px;}
#setup{text-align:center;padding:50px 24px;}
#setup .e{font-size:40px;margin-bottom:12px;}
#setup p{color:var(--muted);font-size:12px;margin-bottom:20px;}
#setup input{padding:14px 18px;border-radius:999px;border:2px solid var(--bg);background:#fff;font-size:13px;width:100%;max-width:280px;margin-bottom:12px;outline:none;}
#setup input:focus{border-color:var(--pink);}
#setup button{padding:14px 32px;border-radius:999px;border:none;background:var(--ink);color:#fff;font-weight:800;cursor:pointer;}
.hidden{display:none!important;}
.empty{text-align:center;color:var(--muted);padding:30px;font-size:12px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><span class="t">✅ tasks</span><div class="tabs"><button class="on" data-f="t">today</button><button data-f="a">all</button></div></div>
  <div id="main"><div class="list" id="list">
    <div class="it"><div class="cb"></div><div class="tt">판매페이지 작성</div><div class="tm">오전</div></div>
    <div class="it"><div class="cb"></div><div class="tt">가이드 작성</div><div class="tm">오후</div></div>
    <div class="it done"><div class="cb">✓</div><div class="tt">공지 업로드</div><div class="tm">완료</div></div>
  </div></div>
  <div id="setup" class="hidden"><div class="e">✅</div><p>노션 토큰을 입력하면<br>할 일이 보여요 🤍</p><input type="password" id="tk" placeholder="Notion 토큰"><br><button id="go">연결하기 🩷</button></div>
</div>
<script>
const API='https://api.notion.com/v1',VER='2022-06-28',DBID='c50c55d8-9436-4edb-5fab-3c76b5e166f';
let TK='';try{TK=localStorage.getItem('nf_token')||'';}catch(e){}
let f='t',ts=[];
const $=s=>document.querySelector(s);
const H=()=>({'Authorization':'Bearer '+TK,'Notion-Version':VER,'Content-Type':'application/json'});
async function api(p,m='GET',b){const r=await fetch(API+p,{method:m,headers:H(),body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json();}
const tn=p=>{try{return p.properties['할 일'].title.map(t=>t.plain_text).join('')||'(제목 없음)';}catch(e){return '(제목 없음)';}};
const st=p=>{try{return p.properties['상태'].status?p.properties['상태'].status.name:p.properties['상태'].select.name;}catch(e){return '할 일';}};
const tm=p=>{try{return p.properties['시간대'].select?p.properties['시간대'].select.name:'';}catch(e){return '';}};
async function load(){const j=await api('/databases/'+DBID+'/query','POST',{page_size:100,sorts:[{timestamp:'created_time',direction:'descending'}]});ts=j.results.map(p=>({id:p.id,t:tn(p),s:st(p),m:tm(p)}));render();}
function render(){let l=f==='t'?ts.filter(t=>t.s!=='완료'):ts;
$('#list').innerHTML=l.length?l.map(t=>'<div class="it'+(t.s==='완료'?' done':'')+'" data-id="'+t.id+'"><div class="cb">'+(t.s==='완료'?'✓':'')+'</div><div class="tt">'+t.t+'</div>'+(t.m?'<div class="tm">'+t.m+'</div>':'')+'</div>').join(''):'<div class="empty">할 일이 없어요 🌷</div>';
document.querySelectorAll('.it .cb').forEach(c=>c.onclick=async e=>{e.stopPropagation();const id=c.parentElement.dataset.id,t=ts.find(x=>x.id===id),ns=t.s==='완료'?'할 일':'완료';try{await api('/pages/'+id,'PATCH',{properties:{'상태':{status:{name:ns}}}});}catch(_){await api('/pages/'+id,'PATCH',{properties:{'상태':{select:{name:ns}}}});}await load();});}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');f=b.dataset.f;render();});
async function boot(){if(!TK)return;$('#setup').classList.add('hidden');$('#main').classList.remove('hidden');try{await load();}catch(e){$('#setup').classList.remove('hidden');$('#main').classList.add('hidden');}}
$('#go').onclick=()=>{const v=$('#tk').value.trim();if(!v)return;TK=v;try{localStorage.setItem('nf_token',v);}catch(e){}boot();};
boot();
</script>
</body>
</html>
