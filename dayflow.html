<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dayflow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#7a5a62;--muted:#c4a8ae;--pink:#ffd6e0;--pink-deep:#f9a8c0;--pink-text:#d46a8a;}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:#fff;color:var(--ink);font-size:13px;margin:0;padding:0;}
.browser{border-radius:14px;overflow:hidden;background:#fff;border:1px solid #f0e6ea;width:100%;}
.chrome{background:#fdf2f5;padding:8px 12px;display:flex;align-items:center;gap:8px;border-bottom:1px solid #f9e8ee;}
.dots{display:flex;gap:5px;}
.dot{width:10px;height:10px;border-radius:50%;}
.dot.r{background:#ff5f57;} .dot.y{background:#febc2e;} .dot.g{background:#28c840;}
.urlbar{flex:1;background:#fff;border-radius:999px;padding:5px 12px;font-size:10px;color:var(--muted);display:flex;align-items:center;gap:6px;}
.datenav{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:700;}
.datenav button{border:none;background:#fff;width:22px;height:22px;border-radius:50%;cursor:pointer;color:var(--pink-text);font-weight:800;font-size:12px;}
.mtabs{display:flex;gap:3px;}
.mtabs button{border:none;background:transparent;padding:5px 10px;border-radius:999px;font-size:9px;font-weight:800;color:var(--muted);cursor:pointer;letter-spacing:.3px;}
.mtabs button.on{background:var(--pink);color:#fff;}
.main{display:grid;grid-template-columns:170px 1fr;min-height:360px;}
.order{padding:12px;border-right:1px solid #f9f0f2;background:#fff;}
.order h3{font-size:10px;font-weight:800;color:var(--muted);letter-spacing:.8px;margin-bottom:8px;}
.oitem{display:flex;gap:6px;padding:6px 2px;font-size:11px;border-bottom:1px solid #faf5f6;align-items:center;}
.oitem .num{font-size:9px;color:var(--muted);font-weight:700;width:14px;flex-shrink:0;}
.oitem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.quads{padding:10px;display:grid;grid-template-columns:1fr 1fr;gap:8px;background:#fffdfc;align-content:start;}
.quad{border-radius:12px;padding:10px;min-height:150px;}
.quad h4{font-size:10px;font-weight:800;margin-bottom:6px;display:flex;justify-content:space-between;align-items:center;}
.q1{background:#ffeef3;} .q1 h4{color:var(--pink-text);}
.q2{background:#fff5eb;} .q2 h4{color:#d49a6a;}
.q3{background:#eef4ff;} .q3 h4{color:#6a9ad4;}
.q4{background:#f5f5f5;} .q4 h4{color:#8a8a8a;}
.qcard{background:#fff;border-radius:8px;padding:7px 9px;margin-bottom:5px;font-size:11px;display:flex;align-items:center;gap:6px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.qcard .dot2{width:8px;height:8px;border-radius:50%;background:var(--pink-deep);flex-shrink:0;}
.qcard .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.conn{padding:8px 12px;background:#fdf2f5;border-top:1px solid #f9e8ee;display:flex;gap:8px;align-items:center;}
.conn input{flex:1;padding:7px 12px;border-radius:999px;border:1px solid #f0e6ea;font-size:11px;outline:none;}
.conn button{padding:7px 16px;border-radius:999px;border:none;background:var(--pink);color:#fff;font-size:11px;font-weight:700;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body>
<div class="browser">
<div class="chrome"><div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div><div class="urlbar">🔒 dayflow</div><div class="datenav"><button>‹</button><span>10월 6일</span><button>›</button></div><div class="mtabs"><button class="on">MATRIX</button><button>FLOW</button><button>REVIEW</button></div></div>
<div class="main">
<div class="order"><h3>ORDER</h3>
<div class="oitem"><span class="num">1</span><span class="t">판매페이지 작성</span></div>
<div class="oitem"><span class="num">2</span><span class="t">가이드 작성</span></div>
<div class="oitem"><span class="num">3</span><span class="t">프로모션 시작</span></div>
<div class="oitem"><span class="num">4</span><span class="t">세 아이디어 테스트</span></div>
<div class="oitem"><span class="num">5</span><span class="t">실패 관련 콘텐츠 업로드</span></div>
</div>
<div class="quads">
<div class="quad q1"><h4>🔥 중요 & 긴급</h4><div class="qcard"><div class="dot2"></div><div class="tt">판매페이지 작성</div></div><div class="qcard"><div class="dot2"></div><div class="tt">가이드 작성</div></div></div>
<div class="quad q2"><h4>⭐ 중요</h4><div class="qcard"><div class="dot2"></div><div class="tt">새 아이디어 테스트</div></div></div>
<div class="quad q3"><h4>⏰ 긴급</h4><div class="qcard"><div class="dot2"></div><div class="tt">공지 업로드</div></div></div>
<div class="quad q4"><h4>💭 기타</h4><div class="qcard"><div class="dot2"></div><div class="tt">정리 정돈</div></div></div>
</div>
</div>
<div class="conn"><input type="password" id="tk" placeholder="Notion 토큰 (선택)"><button id="go">연결 🩷</button></div>
</div>
<script>
const API='https://api.notion.com/v1',VER='2022-06-28',DBID='c50c55d8-9436-4edb-5fab-3c76b5e166f';
let TK='';try{TK=localStorage.getItem('nf_token')||'';if(TK)$('#tk').value=TK;}catch(e){}
async function api(p,m='GET',b){const r=await fetch(API+p,{method:m,headers:{'Authorization':'Bearer '+TK,'Notion-Version':VER,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json();}
$('#go').onclick=()=>{const v=document.querySelector('#tk').value.trim();if(!v)return;TK=v;try{localStorage.setItem('nf_token',v);}catch(e){}location.reload();};
</script>
</body>
</html>
