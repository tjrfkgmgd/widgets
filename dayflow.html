<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>dayflow</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ink:#7a5a62;--muted:#c4a8ae;--pink:#ffd6e0;--pink-deep:#f9a8c0;--pink-text:#d46a8a;}
body{font-family:'Pretendard','Apple SD Gothic Neo',sans-serif;background:#fff;color:var(--ink);font-size:13px;margin:0;padding:0;overflow:hidden;}
.browser{border-radius:14px;overflow:hidden;background:#fff;border:1px solid #f0e6ea;width:100%;height:420px;display:flex;flex-direction:column;}
.chrome{background:#fdf2f5;padding:6px 10px;display:flex;align-items:center;gap:6px;border-bottom:1px solid #f9e8ee;flex-shrink:0;}
.dots{display:flex;gap:4px;}
.dot{width:8px;height:8px;border-radius:50%;}
.dot.r{background:#ff5f57;} .dot.y{background:#febc2e;} .dot.g{background:#28c840;}
.urlbar{flex:1;background:#fff;border-radius:999px;padding:4px 10px;font-size:9px;color:var(--muted);display:flex;align-items:center;gap:5px;}
.datenav{display:flex;align-items:center;gap:4px;font-size:10px;font-weight:700;}
.datenav button{border:none;background:#fff;width:18px;height:18px;border-radius:50%;cursor:pointer;color:var(--pink-text);font-weight:800;font-size:10px;}
.mtabs{display:flex;gap:2px;}
.mtabs button{border:none;background:transparent;padding:4px 8px;border-radius:999px;font-size:8px;font-weight:800;color:var(--muted);cursor:pointer;letter-spacing:.3px;}
.mtabs button.on{background:var(--pink);color:#fff;}
.main{display:grid;grid-template-columns:140px 1fr;flex:1;min-height:0;overflow:hidden;}
.order{padding:8px;border-right:1px solid #f9f0f2;background:#fff;overflow:hidden;}
.order h3{font-size:9px;font-weight:800;color:var(--muted);letter-spacing:.8px;margin-bottom:6px;}
.oitem{display:flex;gap:5px;padding:4px 2px;font-size:10px;border-bottom:1px solid #faf5f6;align-items:center;}
.oitem .num{font-size:8px;color:var(--muted);font-weight:700;width:12px;flex-shrink:0;}
.oitem .t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.quads{padding:8px;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#fffdfc;align-content:start;overflow:hidden;}
.quad{border-radius:10px;padding:8px;min-height:0;}
.quad h4{font-size:9px;font-weight:800;margin-bottom:4px;display:flex;justify-content:space-between;align-items:center;}
.q1{background:#ffeef3;} .q1 h4{color:var(--pink-text);}
.q2{background:#fff5eb;} .q2 h4{color:#d49a6a;}
.q3{background:#eef4ff;} .q3 h4{color:#6a9ad4;}
.q4{background:#f5f5f5;} .q4 h4{color:#8a8a8a;}
.qcard{background:#fff;border-radius:6px;padding:5px 7px;margin-bottom:4px;font-size:10px;display:flex;align-items:center;gap:5px;box-shadow:0 1px 3px rgba(0,0,0,.04);}
.qcard .dot2{width:6px;height:6px;border-radius:50%;background:var(--pink-deep);flex-shrink:0;}
.qcard .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.conn{padding:6px 10px;background:#fdf2f5;border-top:1px solid #f9e8ee;display:flex;gap:6px;align-items:center;flex-shrink:0;}
.conn input{flex:1;padding:5px 10px;border-radius:999px;border:1px solid #f0e6ea;font-size:10px;outline:none;}
.conn button{padding:5px 12px;border-radius:999px;border:none;background:var(--pink);color:#fff;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;}
</style>
</head>
<body>
<div class="browser">
<div class="chrome"><div class="dots"><div class="dot r"></div><div class="dot y"></div><div class="dot g"></div></div><div class="urlbar">🔒 dayflow</div><div class="datenav"><button>‹</button><span>10월 6일</span><button>›</button></div><div class="mtabs"><button class="on">MATRIX</button><button>FLOW</button><button>REVIEW</button></div></div>
<div class="main">
<div class="order"><h3>ORDER</h3>
<div class="oitem"><span class="num">1</span><span class="t">판매페이지 작성</span></div>
<div class="oitem"><span class="num">2</span><span class="t">가이드 작성</span></div>
<div class="oitem"><span class="num">3</span><span class="t">프로모션 시작</span></div>
<div class="oitem"><span class="num">4</span><span class="t">세 아이디어 테스트</span></div>
<div class="oitem"><span class="num">5</span><span class="t">실패 관련 콘텐츠 업로드</span></div>
</div>
<div class="quads">
<div class="quad q1"><h4>🔥 중요 & 긴급</h4><div class="qcard"><div class="dot2"></div><div class="tt">판매페이지 작성</div></div><div class="qcard"><div class="dot2"></div><div class="tt">가이드 작성</div></div></div>
<div class="quad q2"><h4>⭐ 중요</h4><div class="qcard"><div class="dot2"></div><div class="tt">새 아이디어 테스트</div></div></div>
<div class="quad q3"><h4>⏰ 긴급</h4><div class="qcard"><div class="dot2"></div><div class="tt">공지 업로드</div></div></div>
<div class="quad q4"><h4>💭 기타</h4><div class="qcard"><div class="dot2"></div><div class="tt">정리 정돈</div></div></div>
</div>
</div>
<div class="conn"><input type="password" id="tk" placeholder="Notion 토큰 (선택)"><button id="go">연결 🩷</button></div>
</div>
<script>
const API='https://api.notion.com/v1',VER='2022-06-28',DBID='c50c55d8-9436-4edb-5fab-3c76b5e166f';
let TK='';try{TK=localStorage.getItem('nf_token')||'';}catch(e){}
async function api(p,m='GET',b){const r=await fetch(API+p,{method:m,headers:{'Authorization':'Bearer '+TK,'Notion-Version':VER,'Content-Type':'application/json'},body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json();}
function prop(p,n){if(!p||!p[n])return'';const v=p[n];if(v.title)return v.title.map(t=>t.plain_text).join('');if(v.rich_text)return v.rich_text.map(t=>t.plain_text).join('');if(v.select)return v.select.name||'';if(v.status)return v.status.name||'';if(v.date)return v.date.start||'';return'';}
async function load(){if(!TK)return;try{
const d=await api('/databases/'+DBID+'/query','POST',{filter:{property:'날짜',date:{equals:new Date().toISOString().slice(0,10)}},sorts:[{property:'시간대',direction:'ascending'}]});
if(!d.results||!d.results.length)return;
const items=d.results.map(r=>({t:prop(r.properties,'할 일')||'(제목 없음)',imp:prop(r.properties,'중요도'),urg:prop(r.properties,'긴급도'),time:prop(r.properties,'시간대')}));
const ol=document.querySelector('.order');ol.innerHTML='<h3>ORDER</h3>'+items.map((it,i)=>'<div class="oitem"><span class="num">'+(i+1)+'</span><span class="t">'+it.t+'</span></div>').join('');
const q={q1:[],q2:[],q3:[],q4:[]};
items.forEach(it=>{const i=it.imp==='높음',u=it.urg==='높음';if(i&&u)q.q1.push(it);else if(i)q.q2.push(it);else if(u)q.q3.push(it);else q.q4.push(it);});
const qc=c=>c.map(it=>'<div class="qcard"><div class="dot2"></div><div class="tt">'+it.t+'</div></div>').join('');
document.querySelector('.q1').innerHTML='<h4>🔥 중요 & 긴급</h4>'+(qc(q.q1)||'<div style="font-size:10px;color:#c4a8ae">없음</div>');
document.querySelector('.q2').innerHTML='<h4>⭐ 중요</h4>'+(qc(q.q2)||'<div style="font-size:10px;color:#c4a8ae">없음</div>');
document.querySelector('.q3').innerHTML='<h4>⏰ 긴급</h4>'+(qc(q.q3)||'<div style="font-size:10px;color:#c4a8ae">없음</div>');
document.querySelector('.q4').innerHTML='<h4>💭 기타</h4>'+(qc(q.q4)||'<div style="font-size:10px;color:#c4a8ae">없음</div>');
document.querySelector('.conn').style.display='none';
}catch(e){}}
document.querySelector('#go').onclick=()=>{const v=document.querySelector('#tk').value.trim();if(!v)return;TK=v;try{localStorage.setItem('nf_token',v);}catch(e){}load();};
load();
</script>
</body>
</html>
